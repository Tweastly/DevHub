# Builds DevHub's Docker image (DevHub and its Caddy, one container) on every push to main
# and publishes it on GitHub's registry as ghcr.io/<owner>/<repo>:<commit> (and :latest),
# plus :install (the same image, started on its installer), so a single visibility setting
# covers both. DevHub's update pulls the image of the new commit: nothing is built on the
# server.
#
# Shell steps only (no `uses:`), so it runs whatever the repository's allowed-actions policy is.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        run: |
          git init -q .
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Build and push
        run: |
          IMG="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name devhub >/dev/null
          # The registry cache keeps the compiled dependencies between runs.
          docker buildx build --push \
            --cache-from "type=registry,ref=${IMG}:cache" \
            --cache-to "type=registry,ref=${IMG}:cache,mode=max" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "REVISION=${GITHUB_SHA}" --build-arg "REPOSITORY=${GITHUB_REPOSITORY}" \
            -t "${IMG}:${GITHUB_SHA}" -t "${IMG}:latest" .
          # :install, the former name of the installer: the same image, started on `devhub install`.
          docker buildx build --push \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "BASE=${IMG}:${GITHUB_SHA}" \
            -t "${IMG}:install" installer
