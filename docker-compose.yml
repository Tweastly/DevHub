# DevHub in one container: the panel and its HTTPS front (Caddy, started by DevHub).
# Projects run in their own containers, created by DevHub through the Docker socket.
services:
  devhub:
    build: .
    container_name: devhub
    restart: unless-stopped
    # The server's network: Caddy listens on 80 and 443 (and, without a domain, on each web
    # project's port) without a Docker proxy per port, and sees the visitors' real address.
    network_mode: host
    # Forwards stop signals and reaps processes (DevHub and Caddy share the container).
    init: true
    environment:
      DEVHUB_DOMAIN: ${DEVHUB_DOMAIN}
      DEVHUB_ORIGIN: https://${DEVHUB_DOMAIN}
      # DevHub answers on the server's loopback only: everything goes through Caddy.
      DEVHUB_LISTEN: ${DEVHUB_LISTEN:-127.0.0.1:8080}
      DEVHUB_CADDY: "on"
      # Empty: 20000-20999, or 20000-20099 without a domain (one HTTPS port per web project).
      DEVHUB_PORT_RANGE: ${DEVHUB_PORT_RANGE:-}
      DEVHUB_MEMORY_MB: 4096
      DEVHUB_CPUS: 2
      # DevHub reaches each project at its container's address on the project's network.
      DEVHUB_SELF_CONTAINER: devhub
      # Project ports stay off the internet: they're reached only through Caddy.
      DEVHUB_BIND_IP: 127.0.0.1
      # "wildcard" + a Cloudflare token: HTTPS for every *.${DEVHUB_DOMAIN}, so unknown
      # names get DevHub's 404 page. Default "ondemand": one certificate per project.
      DEVHUB_TLS: ${DEVHUB_TLS:-ondemand}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # HTTP_PORT: change it if port 80 is taken (certificates then go through 443).
      HTTP_PORT: ${HTTP_PORT:-80}
      # Fine-grained token, read-only "Contents" on this repo (needed if the repo is private).
      DEVHUB_GITHUB_TOKEN: ${DEVHUB_GITHUB_TOKEN:-}
      # Optional OAuth app for "Se connecter avec GitHub" in Mon profil.
      DEVHUB_GITHUB_CLIENT_ID: ${DEVHUB_GITHUB_CLIENT_ID:-}
      DEVHUB_GITHUB_CLIENT_SECRET: ${DEVHUB_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
      # Only DevHub gets the Docker socket — never the project containers (unless allowed).
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: lets DevHub know which commit is deployed.
      - .:/repo:ro
      # Caddy's certificates (the same volume as when Caddy had its own container).
      - caddy_data:/caddy

volumes:
  caddy_data:
