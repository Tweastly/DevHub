services:
  devhub:
    build: .
    container_name: devhub
    restart: unless-stopped
    environment:
      DEVHUB_DOMAIN: ${DEVHUB_DOMAIN}
      DEVHUB_ORIGIN: https://${DEVHUB_DOMAIN}
      DEVHUB_PORT_RANGE: 20000-20999
      DEVHUB_MEMORY_MB: 4096
      DEVHUB_CPUS: 2
      # DevHub joins each project's network and proxies <projet>.${DEVHUB_DOMAIN} to it.
      DEVHUB_SELF_CONTAINER: devhub
      # Project ports stay off the internet: they're reached only through the subdomains.
      DEVHUB_BIND_IP: 127.0.0.1
      # Fine-grained token, read-only "Contents" on this repo (needed: the repo is private).
      DEVHUB_GITHUB_TOKEN: ${DEVHUB_GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
      # Only the orchestrator gets the Docker socket — never the project containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: lets DevHub know which commit is deployed.
      - .:/repo:ro
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    # HTTP_PORT: change it if port 80 is taken (certificates then go through 443).
    ports: ["${HTTP_PORT:-80}:80", "443:443"]
    environment:
      DEVHUB_DOMAIN: ${DEVHUB_DOMAIN}
    volumes:
      # The folder, not the file: git replaces files on update, and a single-file bind
      # mount keeps showing the old one.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data

volumes:
  caddy_data:
