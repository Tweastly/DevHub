<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PROJECT}}</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e8ee; --mute:#8a93a6; --acc:#6ea8ff; --card:#171a21; --line:#262b36; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#14171f; --mute:#5d6576; --acc:#2f6fed; --card:#fff; --line:#e2e5ea; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui, sans-serif; padding:24px 16px; }
  main { width:100%; max-width:640px; text-align:center; }
  .badge { display:inline-block; font-size:13px; color:var(--mute); border:1px solid var(--line);
           border-radius:99px; padding:2px 12px; margin-bottom:20px; }
  h1 { font-size:clamp(36px, 8vw, 64px); line-height:1.1; margin:0 0 12px;
       background:linear-gradient(90deg, var(--acc), #b78cff); -webkit-background-clip:text; background-clip:text; color:transparent;
       overflow-wrap:anywhere; }
  p { color:var(--mute); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:left; }
  code { font-family:ui-monospace, monospace; font-size:14px; color:var(--acc); }
  ul { margin:8px 0 0; padding-left:20px; }
</style>
</head>
<body>
<main>
  <span class="badge">● en ligne</span>
  <h1>{{PROJECT}}</h1>
  <p>Ton projet est prêt. Cette page est servie depuis son conteneur DevHub.</p>
  <div class="card">
    <b>Pour commencer</b>
    <ul>
      <li>Modifie <code>/workspace/index.html</code>, via le terminal ou Claude Desktop</li>
      <li>Le serveur se lance avec <code>/workspace/start.sh</code></li>
      <li>Ajoute tes fichiers dans <code>/workspace</code>, ils sont servis tels quels</li>
    </ul>
  </div>
</main>
</body>
</html>
